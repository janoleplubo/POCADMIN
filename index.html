</script>
<style>
  :root{
    --accent:#EA4F00;
    --accent-dark:#C74300;
    --ink:#1C1B19;
    --bg:#FAF9F7;
    --surface:#FFFFFF;
    --border:#E4E0D9;
    --muted:#6B655C;
    --success:#2F7A4D;
    --danger:#B3261E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    background:var(--surface); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{height:34px; width:auto;}
  .brand-text{font-weight:700; font-size:15px; letter-spacing:.2px;}
  .brand-sub{font-size:12px; color:var(--muted);}
  .icon-btn{
    background:none; border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink);
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}
  main{flex:1; width:100%; max-width:880px; margin:0 auto; padding:28px 20px 60px;}
  .stepper{display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap;}
  .step-pill{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px;
    border:1px solid var(--border); font-size:13px; color:var(--muted); background:var(--surface);
  }
  .step-pill .num{
    width:20px;height:20px;border-radius:50%; background:var(--border); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
  }
  .step-pill.active{border-color:var(--accent); color:var(--ink); font-weight:600;}
  .step-pill.active .num{background:var(--accent);}
  .step-pill.done .num{background:var(--success);}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; margin-bottom:18px;
  }
  .card h2{margin:0 0 4px; font-size:17px;}
  .card .hint{color:var(--muted); font-size:13px; margin:0 0 16px;}
  .banner{
    background:var(--accent); color:#fff; font-weight:700; font-size:13px;
    padding:8px 12px; border-radius:6px; margin:18px 0 12px; letter-spacing:.2px;
  }
  label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:4px;}

   Le "Matériel OPC" est un parcours totalement à part (incompatible avec

const STEP_LABELS = {

  apercu: "Aperçu", pdf: "PDF", materiel: "Matériel"

function activeStepKeys(){
  if(dossier.docs.materiel) return ["select","materiel"];
  const keys = ["select","chantier"];
  if(dossier.docs.fiche) keys.push("sous-traitants");
  if(dossier.docs.fiche || dossier.docs.quartHeure) keys.push("apercu");
  keys.push("pdf");
  return keys;
}
function goStep(key){
  if(key==="apercu"){
    if(dossier.docs.fiche) dossier.sousTraitants.forEach(st=>{ if(!st.preview) st.preview = computePreview(st); });
    ensureThemes();
  }
  currentStep = key; genMessage=null; window.scrollTo(0,0); render();
}
function goNext(){
  const keys = activeStepKeys();
  const i = keys.indexOf(currentStep);
  if(i>=0 && i<keys.length-1) goStep(keys[i+1]);
}
function goPrev(){
  const keys = activeStepKeys();
  const i = keys.indexOf(currentStep);
  if(i>0) goStep(keys[i-1]);
}

/* =========================================================================
   OUTILS DE MAPPING NOM <-> ID (pour l'écran réglages)
   ========================================================================= */
function idsToNames(ids, collection){
  return (ids||[]).map(id=>{ const it = collection.find(c=>c.id===id); return it?it.nom:null; }).filter(Boolean).join(", ");
}
function namesToIds(text, collection){
  if(!text) return [];
  return text.split(",").map(s=>s.trim()).filter(Boolean).map(name=>{
    const it = collection.find(c=>c.nom.toLowerCase()===name.toLowerCase());
    return it?it.id:null;
  }).filter(Boolean);
}

function computePreview(st){
  const metiers = CONFIG.corpsDeMetier.filter(m => st.metiers.includes(m.id));
  const nature = metiers.map(m=>m.nature).filter(Boolean).join("\n\n");

  function groupedField(fieldName){
    const withField = metiers.filter(m => m[fieldName]);
    if(withField.length > 1){
      return withField.map(m => m.nom+" :\n"+m[fieldName]).join("\n\n");
    } else if(withField.length === 1){
      return withField[0][fieldName];
    }
    return "";
  }
  const produits = groupedField("produits");
  const outillage = groupedField("outillage");

  const metiersAvecEtapes = metiers.filter(m => (m.etapes||[]).length);
  let etapesText;
  if(metiersAvecEtapes.length > 1){
    etapesText = metiersAvecEtapes
      .map(m => m.nom+" :\n"+m.etapes.map((e,i)=>(i+1)+". "+e).join("\n"))
      .join("\n\n");
  } else if(metiersAvecEtapes.length === 1){
    etapesText = metiersAvecEtapes[0].etapes.map((e,i)=>(i+1)+". "+e).join("\n");
  } else {
    etapesText = "";
  }

  let epiSet = new Set(["chaussures"]);
  metiers.forEach(m => (m.epi||[]).forEach(e=>epiSet.add(e)));
  st.risques.forEach(rid=>{
    const r = CONFIG.risques.find(x=>x.id===rid);
    if(r) (r.epi||[]).forEach(e=>epiSet.add(e));
  });
  const epiNames = [...epiSet].map(id=>{ const e = CONFIG.epi.find(x=>x.id===id); return e?e.nom:null; }).filter(Boolean);

  const risqueObjs = st.risques.map(rid=>CONFIG.risques.find(r=>r.id===rid)).filter(Boolean);
  const consignesRisques = risqueObjs.map(r=>r.consignes).filter(Boolean);
  const precautionsText = [CONFIG.textes.precautions, ...consignesRisques].filter(Boolean).join("\n");

  return {
    nature: nature || "—",
    produits: produits || "—",
    outillage: outillage || "—",
    etapesText: etapesText || "—",
    epiText: epiNames.join(", ") || "Chaussures de sécurité",
    precautionsText: precautionsText || "—",
    risquesNames: risqueObjs.map(r=>r.nom)
  };
}
function uniqJoinList(strings){
  const parts = [];
  strings.forEach(s=>{ (s||"").split(",").forEach(p=>{ const t=p.trim(); if(t && !parts.includes(t)) parts.push(t); }); });
  return parts.join(", ");
}

function qhDate(){
  const d = computeChantierDate();
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");
  if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
  const n = new Date();
  return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
}
function isoWeek(dt){
  const d = new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate()));
  const day = d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil(((d-y0)/86400000+1)/7);
}
function adresseVisible(){ return !!(dossier.docs.fiche || dossier.docs.affichages); }
function qhAdresse(){ return adresseVisible() ? (dossier.adresse||"").trim() : ""; }
function qhAutoGroup(){ return (isoWeek(qhDate())-1)%5; }
function qhGroupIndex(){
  const g = dossier.quartHeure.groupe;
  return (g===undefined||g===null||g==="") ? qhAutoGroup() : Number(g);
}
function qhFlags(){
  const f = Object.assign({}, dossier.risquesSpec);
  if(dossier.docs.fiche){
    const ids = new Set();
    dossier.sousTraitants.forEach(st=>st.risques.forEach(r=>ids.add(r)));
    ["amiante","plomb","coactivite","chaleur"].forEach(k=>{ if(ids.has(k)) f[k]=true; });
  }
  const dt = qhDate();
  const mo = dt.getUTCMonth()+1;
  if(mo>=6 && mo<=8 && dt.getUTCDate()<=7) f.chaleur = true; // 1 fois par mois en été (1re semaine du mois)
  return f;
}
function computeThemesText(){
  const g = QH_GROUPS[qhGroupIndex()];
  const f = qhFlags();
  const out = [];
  CONFIG.socleQuartHeure.forEach(l=>out.push(l));
  g.lines.forEach(l=>out.push(l.replace("@ADRESSE@", qhAdresse() || DOTS)));
  Object.keys(QH_SPECIAUX).forEach(k=>{ if(f[k]) QH_SPECIAUX[k].lines.forEach(l=>out.push(l)); });
  return out.join("\n");
}
function qhSignature(){
  return JSON.stringify([qhGroupIndex(), qhFlags(), qhAdresse(), CONFIG.socleQuartHeure]);
}
function ensureThemes(){
  if(!dossier.docs.quartHeure) return;
  const sig = qhSignature();
  if(!dossier.quartHeure.themesText || dossier.quartHeure.sig!==sig){
    dossier.quartHeure.themesText = computeThemesText();
    dossier.quartHeure.sig = sig;
  }
}

function setQhGroupe(v){ dossier.quartHeure.groupe = v===""?"":Number(v); dossier.quartHeure.themesText=""; ensureThemes(); render(); }

const EMARGEMENT_ROWS = 11;
const TABLE_ROW_H = 7.3;
const TABLE_HEADER_H = 8.5;
const SZ = { body:10.5, label:10.5, subhead:11.5, banner:12, title:16, subtitle:9.5, small:8 };

class Doc{
  constructor(pdf){
    this.pdf = pdf; this.margin = 16; this.pageW = 210; this.pageH = 297;
    this.contentW = this.pageW - this.margin*2; this.pageNum = 0; this.y = this.margin;
  }
  newPage(){
    if(this.pageNum>0) this.pdf.addPage();
    this.pageNum++; this.y = this.margin;
    const p=this.pdf;
    p.setFillColor(234,79,0); p.rect(0, 0, 3, this.pageH, "F");
    if(this.showFooter!==false) this.footer();
  }
  footer(){
    const p=this.pdf;
    p.setFont("helvetica","normal"); p.setFontSize(7); p.setTextColor(130,130,130);
    p.text("SOCIÉTÉ ANONYME AU CAPITAL DE 2.000.000 € - R.C.S. PARIS 542 062 617 B - SIRET 542 062 617 00031 - CODE APE : 452 B", this.margin, this.pageH-14);
    p.text("TVA intracommunautaire : FR 32 542 062 617", this.margin, this.pageH-10);
    p.setFillColor(234,79,0); p.circle(this.pageW-this.margin-3, this.pageH-11.3, 3.6, "F");
    p.setFont("helvetica","bold"); p.setFontSize(8); p.setTextColor(255,255,255);
    p.text(String(this.pageNum), this.pageW-this.margin-3, this.pageH-10.1, {align:"center"});
    p.setTextColor(30,30,30);
  }
  ensureSpace(h){ if(this.y + h > this.pageH - 20){ this.newPage(); } }
  header(title, subtitle){
    const p=this.pdf;
    try{ p.addImage(LOGO_B64, "PNG", this.margin, this.y, 20, 20); }catch(e){}
    p.setFont("helvetica","bold"); p.setFontSize(SZ.title);
    p.text(title, this.margin+26, this.y+9);
    if(subtitle){
      p.setFont("helvetica","italic"); p.setFontSize(SZ.subtitle); p.setTextColor(110,110,110);
      const lines = p.splitTextToSize(subtitle, this.contentW-26);
      p.text(lines, this.margin+26, this.y+15.5);
      p.setTextColor(30,30,30);
    }
    this.y += 23;
    p.setDrawColor(234,79,0); p.setLineWidth(0.7);
    p.line(this.margin, this.y, this.pageW-this.margin, this.y);
    p.setLineWidth(0.2);
    this.y += 7;
  }
  subheading(text){
    this.ensureSpace(8); const p=this.pdf;
    p.setFillColor(234,79,0); p.circle(this.margin+1, this.y-1.6, 1, "F");
    p.setFont("helvetica","bold"); p.setFontSize(SZ.subhead); p.setTextColor(196,67,0);
    p.text(text, this.margin+5, this.y);
    p.setTextColor(30,30,30);
    this.y += 6;
  }
  paragraph(text, opts){
    opts = opts||{};
    const p=this.pdf;
    p.setFont("helvetica", opts.bold?"bold":(opts.italic?"italic":"normal"));
    p.setFontSize(opts.size||SZ.body);
    const lines = p.splitTextToSize(String(text||""), this.contentW);
    lines.forEach(line=>{ this.ensureSpace(6); p.text(line, this.margin, this.y); this.y += (opts.lh||5.4); });
    this.y += (opts.gapAfter!==undefined?opts.gapAfter:2.5);
  }
  bullets(items, opts){
    opts = opts||{};
    const p=this.pdf; const size=opts.size||SZ.body; const lh=opts.lh||5.2;
    p.setFont("helvetica","normal"); p.setFontSize(size);
    (items||[]).forEach(it=>{
      const lines = p.splitTextToSize(String(it), this.contentW-6);
      lines.forEach((line,i)=>{
        this.ensureSpace(lh+0.4);
        p.text((i===0?"•  ":"    ")+line, this.margin, this.y);
        this.y += lh;
      });
    });
    this.y += (opts.gapAfter!==undefined?opts.gapAfter:2.5);
  }
  stepsBlock(text){
    const p=this.pdf;
    const lines = splitLinesArr(text);
    lines.forEach(line=>{
      const isHeading = /:\s*$/.test(line.trim());
      p.setFont("helvetica", isHeading?"bold":"normal");
      p.setFontSize(isHeading?SZ.subhead-1.5:SZ.body);
      if(isHeading){ p.setTextColor(196,67,0); this.y += 1; }
      const wrapped = p.splitTextToSize(line, this.contentW);
      wrapped.forEach(w=>{
        this.ensureSpace(5.8);
        p.text(w, this.margin, this.y);
        this.y += isHeading?5.6:5.2;
      });
      if(isHeading) p.setTextColor(30,30,30);
    });
    this.y += 2.5;
  }
  listBlock(text){
    const p=this.pdf;
    const lines = splitLinesArr(text);
    lines.forEach(line=>{
      const isHeading = /:\s*$/.test(line.trim());
      if(isHeading){
        p.setFont("helvetica","bold"); p.setFontSize(SZ.subhead-1.5); p.setTextColor(196,67,0);
        this.ensureSpace(6); this.y += 1;
        const wrapped = p.splitTextToSize(line, this.contentW);
        wrapped.forEach(w=>{ this.ensureSpace(5.6); p.text(w, this.margin, this.y); this.y += 5.6; });
        p.setTextColor(30,30,30);
      } else {
        this.bullets(splitCommaArr(line), {gapAfter:1});
      }
    });
    this.y += 1.5;
  }
  keyValue(label, value){
    const p=this.pdf; this.ensureSpace(6);
    p.setFont("helvetica","bold"); p.setFontSize(SZ.label);
    p.text(label+" :", this.margin, this.y);
    const labelW = p.getTextWidth(label+" :  ");
    p.setFont("helvetica","normal");
    const lines = p.splitTextToSize(String(value===undefined||value===null||value===""?"—":value), this.contentW-labelW-2);
    p.text(lines[0]||"—", this.margin+labelW+2, this.y);
    this.y += 5.4;
    for(let i=1;i<lines.length;i++){ this.ensureSpace(5.4); p.text(lines[i], this.margin+labelW+2, this.y); this.y += 5.4; }
    this.y += 1;
  }
  keyValueRow(pairs){
    const p=this.pdf; this.ensureSpace(5.6); const colW = this.contentW/pairs.length;
    pairs.forEach((pair,i)=>{
      const x = this.margin + i*colW;
      p.setFont("helvetica","bold"); p.setFontSize(SZ.label);
      p.text(pair[0]+" :", x, this.y);
      const labelW = p.getTextWidth(pair[0]+" :  ");
      p.setFont("helvetica","normal");
      const val = String(pair[1]===undefined||pair[1]===null||pair[1]===""?"—":pair[1]);
      const lines = p.splitTextToSize(val, colW-labelW-4);
      p.text(lines[0]||"—", x+labelW+2, this.y);
    });
    this.y += 5.6;
  }
  banner(text){
    this.ensureSpace(14); const p=this.pdf;
    p.setFillColor(234,79,0); p.rect(this.margin, this.y, this.contentW, 9.5, "F");
    p.setTextColor(255,255,255); p.setFont("helvetica","bold"); p.setFontSize(SZ.banner);
    p.text(text, this.margin+3.5, this.y+6.6);
    p.setTextColor(30,30,30); this.y += 14.5;
  }
  signatureTable(rows){
    const p=this.pdf; const colW=[32,32,50,this.contentW-114]; const rowH=TABLE_ROW_H;
    const totalW = colW.reduce((a,b)=>a+b,0);
    this.ensureSpace(rowH+9);
    let cx=this.margin;
    const headerLabels = ["Prénom","Nom","Signature","Entreprise"];
    headerLabels.forEach((h,i)=>{
      p.setFillColor(234,79,0);
      p.setDrawColor(234,79,0);
      p.rect(cx,this.y,colW[i],TABLE_HEADER_H,"FD");
      p.setFont("helvetica","bold");
      p.setFontSize(SZ.body);
      p.setTextColor(255,255,255);
      p.text(String(h), cx+3, this.y+5.9);
      cx+=colW[i];
    });
    this.y += TABLE_HEADER_H; p.setTextColor(30,30,30); p.setFont("helvetica","normal"); p.setDrawColor(210,206,199);
    for(let r=0;r<rows;r++){
      this.ensureSpace(rowH);
      cx=this.margin;
      if(r%2===1){ p.setFillColor(250,244,238); p.rect(this.margin,this.y,totalW,rowH,"F"); }
      colW.forEach(w=>{ p.setDrawColor(210,206,199); p.rect(cx,this.y,w,rowH,"S"); cx+=w; });
      this.y += rowH;
    }
  }
  // Tableau générique (en-tête + lignes), avec retour à la ligne et pagination automatique.
  // headers: string[] ; rows: string[][] ; colW: number[] (mm, somme <= contentW) ; aligns: ("left"|"right")[] optionnel
  table(headers, rows, colW, aligns){
    const p=this.pdf; const headerH=7.2;
    const totalW = colW.reduce((a,b)=>a+b,0);
    const drawHeader = ()=>{
      this.ensureSpace(headerH+6);
      let cx=this.margin;
      headers.forEach((h,i)=>{
        p.setFillColor(234,79,0); p.setDrawColor(234,79,0);
        p.rect(cx,this.y,colW[i],headerH,"FD");
        p.setFont("helvetica","bold"); p.setFontSize(SZ.body-0.5); p.setTextColor(255,255,255);
        const align = aligns&&aligns[i];
        if(align==="right") p.text(String(h), cx+colW[i]-2.5, this.y+5.0, {align:"right"});
        else p.text(String(h), cx+2.5, this.y+5.0);
        cx+=colW[i];
      });
      this.y += headerH; p.setTextColor(30,30,30); p.setDrawColor(210,206,199);
    };
    drawHeader();
    p.setFont("helvetica","normal"); p.setFontSize(SZ.body-0.5);
    rows.forEach((row,r)=>{
      const wrapped = row.map((cell,i)=> p.splitTextToSize(String(cell===undefined||cell===null?"":cell), colW[i]-5));
      const maxLines = Math.max(1, ...wrapped.map(w=>w.length));
      const rowH = 4.6*maxLines + 2.4;
      if(this.y + rowH > this.pageH - 20){ this.newPage(); drawHeader(); p.setFont("helvetica","normal"); p.setFontSize(SZ.body-0.5); }
      let cx=this.margin;
      if(r%2===1){ p.setFillColor(250,244,238); p.rect(this.margin,this.y,totalW,rowH,"F"); }
      wrapped.forEach((lines,i)=>{
        p.setDrawColor(210,206,199); p.rect(cx,this.y,colW[i],rowH,"S");
        const align = aligns&&aligns[i];
        lines.forEach((line,li)=>{
          const ty = this.y+4.4+li*4.6;
          if(align==="right") p.text(line, cx+colW[i]-2.5, ty, {align:"right"});
          else p.text(line, cx+2.5, ty);
        });
        cx+=colW[i];
      });
      this.y += rowH;
    });
    this.y += 2;
  }
}
function splitLinesArr(text){ return String(text||"").split("\n").map(s=>s.trim()).filter(Boolean); }
function splitCommaArr(text){ return String(text||"").split(",").map(s=>s.trim()).filter(Boolean); }
function computeChantierDate(){
  const dates = dossier.sousTraitants.map(s=>s.dateDebut).filter(Boolean).sort();
  return dates[0] || dossier.dateDebut || "—";
}

// Calcule la plus grande taille de police (parmi une liste décroissante) qui permet
// aux thèmes du 1/4h sécurité de tenir dans l'espace disponible avant le tableau
// d'émargement, afin que tout le document tienne sur une seule page.
const THEME_FIT_SIZES = [
  {size:9.8, lh:4.6}, {size:9.3, lh:4.35}, {size:8.8, lh:4.1}, {size:8.3, lh:3.85},
  {size:7.8, lh:3.6}, {size:7.3, lh:3.35}, {size:6.8, lh:3.1}
];
function qhHeight(pdf, items, maxWidth, opt){
  let h = 0;
  items.forEach((it,i)=>{
    if(it.startsWith("## ")){
      pdf.setFont("helvetica","bold"); pdf.setFontSize(opt.size+0.8);
      h += (i>0?opt.lh*0.5:0) + pdf.splitTextToSize(it.slice(3), maxWidth).length*opt.lh;
    } else {
      pdf.setFont("helvetica","normal"); pdf.setFontSize(opt.size);
      h += pdf.splitTextToSize(it.replace(/^-\s*/,""), it.startsWith("-")?maxWidth-5:maxWidth).length*opt.lh + (it.startsWith("-")?0:opt.lh*0.3);
    }
  });
  return h;
}
function fitThemeFont(pdf, items, maxWidth, availableHeight){
  for(const opt of THEME_FIT_SIZES){
    if(qhHeight(pdf, items, maxWidth, opt) <= availableHeight) return opt;
  }
  return THEME_FIT_SIZES[THEME_FIT_SIZES.length-1];
}
function drawThemes(D, items, opt){
  const p = D.pdf;
  items.forEach((it,i)=>{
    if(it.startsWith("## ")){
      p.setFont("helvetica","bold"); p.setFontSize(opt.size+0.8); p.setTextColor(0,0,0);
      if(i>0) D.y += opt.lh*0.5;
      p.splitTextToSize(it.slice(3), D.contentW).forEach(l=>{ D.ensureSpace(opt.lh+0.4); p.text(l, D.margin, D.y); D.y += opt.lh; });
    } else {
      p.setFont("helvetica","normal"); p.setFontSize(opt.size); p.setTextColor(0,0,0);
      const dash = it.startsWith("-");
      p.splitTextToSize(it.replace(/^-\s*/,""), dash?D.contentW-5:D.contentW).forEach((l,k)=>{ D.ensureSpace(opt.lh+0.4); if(dash&&k===0) p.text("-", D.margin+1, D.y); p.text(l, D.margin+(dash?5:0), D.y); D.y += opt.lh; });
      if(!dash) D.y += opt.lh*0.3;
    }
  });
}

function renderQuartHeure(D){
  D.newPage();

  D.keyValueRow([["Présentateur", dossier.quartHeure.presentateur || dossier.cdtNom || "—"], ["Support fait par", dossier.quartHeure.supportPar || dossier.cdtNom || "—"]]);
  D.y += 3;
  D.subheading("Thèmes abordés");

  const items = splitLinesArr(dossier.quartHeure.themesText);
  const bottomLimit = D.pageH - 20;
  const fixedAfterThemes = 2 + 2.5 + 6 + TABLE_HEADER_H + EMARGEMENT_ROWS*TABLE_ROW_H;
  const availableForThemes = bottomLimit - D.y - fixedAfterThemes;
  const fit = fitThemeFont(D.pdf, items, D.contentW-6, availableForThemes);

  drawThemes(D, items, fit); D.y += 2;
  D.y += 2.5;
  D.subheading("Émargement");
  D.signatureTable(EMARGEMENT_ROWS);
}

let lastPdfUrl = null;
let lastPdfFilename = null;

/* =========================================================================
   PANNEAUX DE SIGNALÉTIQUE (visuels fournis par l'utilisateur, en fond de
   page ; seuls le chantier et le numéro de zone sont surimposés).
   Coordonnées calées par OCR sur les visuels d'origine (repère jsPDF :
   origine en haut à gauche, contrairement au repère bas-gauche utilisé lors
   du calage initial -> y converti ici : y_jspdf = 297 - y_bas).
   ========================================================================= */
const SIGNAGE_CHANTIER_X = 46;
const SIGNAGE_CHANTIER_Y = 297 - 12.6;
const SIGNAGE_CHANTIER_MAXW = 60;
const SIGNAGE_ZONE_X = 112;
const SIGNAGE_ZONE_Y = 297 - 12.6;

function fitFontForWidth(pdf, text, maxWidthMm, startSize){
  let size = startSize;
  for(; size > 7; size -= 0.5){
    pdf.setFont("helvetica","normal");
    pdf.setFontSize(size);
    if(pdf.getTextWidth(text) <= maxWidthMm) break;
  }
  return size;
}
function addSignagePage(pdf, b64, isFirstPage){
  if(!isFirstPage) pdf.addPage();
  try{ pdf.addImage(b64, "PNG", 0, 0, 210, 297); }catch(e){ console.error("Signage image error", e); }
}
function drawSignageChantier(pdf, chantierText){
  const size = fitFontForWidth(pdf, chantierText, SIGNAGE_CHANTIER_MAXW, 10.5);
  pdf.setTextColor(25,24,22);
  pdf.setFont("helvetica","normal");
  pdf.setFontSize(size);
  pdf.text(chantierText, SIGNAGE_CHANTIER_X, SIGNAGE_CHANTIER_Y);
}
function drawSignageZone(pdf, zoneNumber){
  pdf.setTextColor(25,24,22);
  pdf.setFont("helvetica","bold");
  pdf.setFontSize(10.5);
  pdf.text("Zone n° : "+zoneNumber, SIGNAGE_ZONE_X, SIGNAGE_ZONE_Y);
}
function renderSignagePages(pdf, isFirstContent){
  const chantierText = (dossier.affaire||"").trim() || (dossier.adresse||"").trim() || "—";
  const nbZones = Math.max(0, parseInt(dossier.nbZones)||0);
  let firstPage = !!isFirstContent;

  addSignagePage(pdf, SIGNAGE_BASEVIE_B64, firstPage); firstPage = false;
  drawSignageChantier(pdf, chantierText);

  addSignagePage(pdf, SIGNAGE_STOCKAGE_B64, firstPage);
  drawSignageChantier(pdf, chantierText);

  for(let z=1; z<=nbZones; z++){
    addSignagePage(pdf, SIGNAGE_INTERDIT_B64, firstPage);
    drawSignageChantier(pdf, chantierText);
    drawSignageZone(pdf, z);

    addSignagePage(pdf, SIGNAGE_EPI_B64, firstPage);
    drawSignageChantier(pdf, chantierText);
    drawSignageZone(pdf, z);
  }
}

function autoOpenPdf(url, filename){
  try{
    const a = document.createElement("a");
    a.href = url; a.download = filename||"document.pdf"; a.style.display="none";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){}
  try{ window.open(url, "_blank"); }catch(e){}
}

function generatePdf(){
  try{
    if(!window.jspdf){ genMessage = {type:"error", text:"La bibliothèque PDF ne s'est pas chargée (vérifiez la connexion), réessayez."}; render(); return; }
    if(!dossier.docs.fiche && !dossier.docs.quartHeure && !dossier.docs.affichages){
      genMessage = {type:"error", text:"Aucun document sélectionné — retournez à l'étape « Documents » pour en cocher au moins un."};
      render(); return;
    }
    if(dossier.docs.fiche) dossier.sousTraitants.forEach(st => { if(!st.preview) st.preview = computePreview(st); });
    ensureThemes();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit:"mm", format:"a4" });
    const D = new Doc(pdf);
    if(dossier.docs.fiche) dossier.sousTraitants.forEach((st,i)=> renderFicheIntervention(D, st, i));
    if(dossier.docs.quartHeure) renderQuartHeure(D);
    if(dossier.docs.affichages) renderSignagePages(pdf, D.pageNum===0);

    const safeAffaire = ([dossier.affaire, dossier.nomChantier].filter(x=>x&&x.trim()).join("_")||"chantier").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\-]+/gi,"_").replace(/^_+|_+$/g,"");
    const filename = "Demarrage_chantier_"+safeAffaire+".pdf";
    const blob = pdf.output("blob");
    if(lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
    lastPdfUrl = URL.createObjectURL(blob);
    lastPdfFilename = filename;
    autoOpenPdf(lastPdfUrl, filename);

    genMessage = {type:"success", text:"PDF téléchargé et ouvert. S'il ne s'est pas ouvert, utilisez le bouton ci-dessous."};
  }catch(e){
    console.error(e);
    genMessage = {type:"error", text:"Une erreur est survenue pendant la génération : "+e.message};
  }
  render();
}

function toggleMetier(id, metierId, checked){
  const st = dossier.sousTraitants.find(s=>s.id===id);
  if(!st) return;
  if(checked){
    if(!st.metiers.includes(metierId)) st.metiers.push(metierId);
    const m = CONFIG.corpsDeMetier.find(x=>x.id===metierId);
    if(m) (m.risques||[]).forEach(r=>{ if(RISQUES_FICHE.includes(r) && !st.risques.includes(r)) st.risques.push(r); });
  } else {
    st.metiers = st.metiers.filter(x=>x!==metierId);
  }
  st.preview = null; render();
}

  const st = dossier.sousTraitants.find(s=>s.id===id);

  if(checked){ if(!st.risques.includes(risqueId)) st.risques.push(risqueId); }

function updateSocle(value){ CONFIG.socleQuartHeure = splitLinesArr(value); }
function updateAccessCode(value){ CONFIG.accessCode = value; }

function saveSettings(){
  genMessage = {type:"success", text:"Réglages appliqués pour votre session en cours."};
  settingsOpen = false; render();
}

/* --- Gate --- */
function updateGateInput(v){ gateInput = v; }
function submitGate(){
  const typed = gateInput.trim().toLowerCase();
  const codes = [String(CONFIG.accessCode), "abid"].map(c=>c.toLowerCase());
  if(codes.includes(typed)){ unlocked = true; gateError=""; }
  else { gateError = "Code incorrect."; }
  render();
}

function renderStepper(){
  const keys = activeStepKeys();
  const currentIdx = keys.indexOf(currentStep);
  const mob = '<div class="stepper-m"><small>Étape '+(currentIdx+1)+' sur '+keys.length+' · '+STEP_LABELS[currentStep]+'</small><div class="pb"><i style="width:'+Math.round((currentIdx+1)/keys.length*100)+'%"></i></div></div>';
  return mob+'<div class="stepper">'+keys.map((key,i)=>{
    const n=i+1; const cls = key===currentStep?"active":(i<currentIdx?"done":"");
    return '<div class="step-pill '+cls+'" style="cursor:pointer;" onclick="goStep(\''+key+'\')"><span class="num">'+n+'</span>'+STEP_LABELS[key]+'</div>';
  }).join('')+'</div>';
}

const PRECOMMANDE_CODE = "2510";

function parseQtyMateriel(v){
  let t = String(v==null?"":v).trim().replace(",",".");
  if(t.indexOf("/")>0){
    const p = t.split("/"); const a = parseFloat(p[0]), b = parseFloat(p[1]);
    return (b>0 && isFinite(a)) ? Math.max(0,a/b) : 0;
  }
  const n = parseFloat(t); return (isFinite(n)&&n>0)?n:0;
}
function stepMaterielQty(catIdx, itemIdx, delta){
  const item = CATEGORIES_MATERIEL[catIdx].items[itemIdx];
  const n = Math.max(0, Math.round(((item.qty||0)+delta)*1e6)/1e6);
  item.qty = n; item.qtyTxt = String(n);
  render();
}
function updateMaterielItem(catIdx, itemIdx, field, value){
  const item = CATEGORIES_MATERIEL[catIdx].items[itemIdx];
  if(field==="qty"){ item.qtyTxt = String(value); item.qty = parseQtyMateriel(value); }
  else if(field==="prix") item[field] = parseFloat(value)||0;
  else if(field==="global" || field==="roundUp") item[field] = !!value;
  else item[field] = value;
  if(field==="qty" || field==="global" || field==="roundUp") recomputeMaterielTotals();
}

function updateMaterielLogements(value){
  materielState.nombreLogements = parseInt(value)||1;
  recomputeMaterielTotals();
}
function computeMaterielItemTotal(item, mult){
  let total = item.global ? (item.qty||0) : (item.qty||0)*mult;
  total += item.extra||0;
  total = Math.round(total*1e6)/1e6;
  if(item.roundUp) total = Math.ceil(total);
  return total;
}
function recomputeMaterielTotals(){
  const mult = Math.max(1, parseInt(materielState.nombreLogements)||1);
  CATEGORIES_MATERIEL.forEach((cat,catIdx)=>{
    cat.items.forEach((item,itemIdx)=>{
      const el = document.getElementById("mtot_"+catIdx+"_"+itemIdx);
      if(el) el.textContent = computeMaterielItemTotal(item, mult);
    });
  });
}

function groupBySupplierMateriel(){
  const groups = {};
  const mult = Math.max(1, parseInt(materielState.nombreLogements)||1);
  CATEGORIES_MATERIEL.forEach(cat=>{
    if(cat.active===false) return;
    cat.items.forEach(item=>{
      const fournisseur = (cat.fournisseurParItem ? item.fournisseur : cat.fournisseur) || "Fournisseur à préciser";
      const totalQty = computeMaterielItemTotal(item, mult);
      if(totalQty<=0) return;
      if(!groups[fournisseur]) groups[fournisseur] = [];
      groups[fournisseur].push({label:item.label, qty:totalQty});
    });
  });
  return groups;
}

function generateMateriel(){
  const groups = groupBySupplierMateriel();
  let html = "";
  const suppliers = Object.keys(groups).sort();
  const mult = Math.max(1, parseInt(materielState.nombreLogements)||1);
  const sectionTitle = (txt)=> '<h2 style="font-size:21px;font-weight:800;color:#fff;background:var(--accent);padding:10px 14px;border-radius:8px;margin:26px 0 14px;">'+esc(txt)+'</h2>';

  if(materielState.genOptions.recap){
    html += sectionTitle("① Récapitulatif — validation sous-traitant"+(mult>1?" (× "+mult+" logements)":""));
    const lignes = [];
    CATEGORIES_MATERIEL.forEach(cat=>{
      if(cat.active===false) return;
      const itemsAvecQte = cat.items.filter(it=>computeMaterielItemTotal(it, mult)>0);
      if(!itemsAvecQte.length) return;
      lignes.push("**"+cat.nom.toUpperCase()+"**");
      itemsAvecQte.forEach(it=> lignes.push("- "+it.label+" : "+computeMaterielItemTotal(it, mult)));
      lignes.push("");
    });
    const text = "Récapitulatif matériel"+(materielState.chantierRef?" — "+materielState.chantierRef:"")+"\nMerci de valider les quantités ci-dessous.\n\n"+lignes.join("\n").trim();
    html += outputBlockListMateriel("Récapitulatif (à valider par le sous-traitant)", text);
  }
  if(materielState.genOptions.emails){
    html += sectionTitle("② Mails de demande de prix"+(mult>1?" (× "+mult+" logements)":""));
    suppliers.forEach(f=>{
      const lines = groups[f].map(it=>"- "+it.label+" : "+it.qty).join("\n");
      const subject = "Demande de prix"+(materielState.chantierRef?" — chantier "+materielState.chantierRef:"");
      const body = "Bonjour,\n\nPourriez-vous me transmettre un devis pour les articles suivants :\n\n"+lines+
        "\n\nMerci de votre retour rapide.";
      html += outputBlockEmailMateriel(f, subject, body);
    });
  }
  if(materielState.genOptions.listes){
    html += sectionTitle("③ Listes par fournisseur"+(mult>1?" (× "+mult+" logements)":""));
    suppliers.forEach(f=>{
      const lines = groups[f].map(it=>"- "+it.label+" : "+it.qty).join("\n");
      const text = "Fournisseur : "+f+(materielState.chantierRef?"\nChantier / réf. : "+materielState.chantierRef:"")+"\n\n"+lines;
      html += outputBlockListMateriel(f, text);
    });
  }
  if(materielState.genOptions.precommande){
    html += sectionTitle("④ Liste de commande plomberie");
    if(materielState.codePrecommande !== PRECOMMANDE_CODE){
      html += '<div class="st-card" style="border-color:#C0392B;"><strong style="color:#C0392B;">Code incorrect.</strong>'+
        '<p style="font-size:13px;color:var(--muted);margin-top:6px;">Saisissez le code d\'accès ci-dessus pour générer le bon de commande plomberie.</p></div>';
    } else {
      try{
        generateDevisPlomberiePDF(mult);
        autoOpenPdf(materielState.devisPdfUrl, materielState.devisPdfFilename);
        let missingWarning = "";
        if(materielState.devisMissingPrix && materielState.devisMissingPrix.length){
          missingWarning = '<div class="st-card" style="border-color:#C45A00;background:#FFF6E9;margin-bottom:10px;"><strong style="color:#C45A00;">⚠ Prix manquant pour '+materielState.devisMissingPrix.length+' article(s)</strong>'+
            '<p style="font-size:13px;color:var(--muted);margin:6px 0 0;">Le bon de commande est généré mais incomplet (marqué "MANQUANT") pour : '+esc(materielState.devisMissingPrix.join(", "))+'.</p></div>';
        }
        html += missingWarning+'<div class="st-card"><strong>Liste de commande plomberie prête</strong>'+
          '<p style="font-size:13px;color:var(--muted);margin:6px 0 10px;">Chantier : '+esc(materielState.chantierRef||"—")+(mult>1?" — × "+mult+" logements":"")+'</p>'+
          '<a class="btn" style="display:inline-block;text-decoration:none;" href="'+materielState.devisPdfUrl+'" download="'+esc(materielState.devisPdfFilename)+'" target="_blank" rel="noopener">⬇ Ouvrir / télécharger le PDF</a></div>';
      }catch(e){
        console.error(e);
        html += '<div class="st-card" style="border-color:#C0392B;"><strong style="color:#C0392B;">Erreur lors de la génération :</strong> '+esc(e.message)+'</div>';
      }
    }
  }
  if(!materielState.genOptions.listes && !materielState.genOptions.emails && !materielState.genOptions.recap && !materielState.genOptions.precommande){
    html = '<p style="color:var(--muted);font-size:13px;">Cochez au moins une option avant de générer.</p>';
  }
  materielState.outputHtml = html;
  render();
  setTimeout(()=>{ const el=document.getElementById("materiel-resultats"); if(el) el.scrollIntoView({behavior:"smooth"}); }, 50);
}

function generateDevisPlomberiePDF(mult){
  if(!window.jspdf) throw new Error("Bibliothèque PDF non chargée — vérifiez la connexion et réessayez.");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:"mm", format:"a4" });
  const D = new Doc(pdf);
  D.showFooter = false;
  D.newPage();
  D.header("LISTE DE COMMANDE PLOMBERIE", "Chantier "+(materielState.chantierRef||"—")+" — à transmettre au fournisseur pour chiffrage du total");

  const today = new Date();
  const dateStr = String(today.getDate()).padStart(2,"0")+"/"+String(today.getMonth()+1).padStart(2,"0")+"/"+today.getFullYear();
  D.keyValueRow([["Chantier / réf.", materielState.chantierRef||"—"], ["Date", dateStr]]);
  D.keyValueRow([["Fournisseur", "SFCP"], ["Logements", String(mult)]]);
  D.y += 2;

  const plomberie = CATEGORIES_MATERIEL.find(c=>c.id==="plomberie");
  const rows = [];
  const missing = [];
  let totalHT = 0;
  (plomberie ? plomberie.items : []).forEach(item=>{
    const qty = computeMaterielItemTotal(item, mult);
    if(qty<=0) return;
    const pu = item.prix||0;
    const missingPrix = !pu;
    if(missingPrix) missing.push(item.label);
    const ligneHT = qty*pu;
    totalHT += ligneHT;
    rows.push([item.ref||"—", item.label, String(qty), missingPrix?"MANQUANT":pu.toFixed(2), ligneHT.toFixed(2)]);
  });
  materielState.devisMissingPrix = missing;

  if(missing.length){
    const msg = "ATTENTION — Prix manquant pour "+missing.length+" article(s) : devis incomplet tant qu'ils ne sont pas renseignés : "+missing.join(", ");
    pdf.setFont("helvetica","bold"); pdf.setFontSize(SZ.body-1);
    const innerW = D.contentW-10;
    const lines = pdf.splitTextToSize(msg, innerW);
    const boxH = 4.6*lines.length + 6;
    D.ensureSpace(boxH+4);
    pdf.setFillColor(255,235,235); pdf.setDrawColor(210,0,0);
    pdf.rect(D.margin, D.y, D.contentW, boxH, "FD");
    pdf.setTextColor(210,0,0);
    lines.forEach((l,i)=> pdf.text(l, D.margin+5, D.y+5.2+i*4.6));
    D.y += boxH + 4;
    pdf.setTextColor(30,30,30); pdf.setFont("helvetica","normal");
  }

  D.subheading("Détail des articles");
  D.table(
    ["Réf.","Désignation","Qté","PU HT (EUR)","Total HT (EUR)"],
    rows,
    [26, D.contentW-26-16-30-30, 16, 30, 30],
    ["left","left","right","right","right"]
  );

  D.y += 2;
  D.ensureSpace(15);
  const p = pdf;
  const boxW = 74, boxX = D.margin+D.contentW-boxW;
  p.setDrawColor(210,206,199);
  p.rect(boxX, D.y, boxW, 11, "S");
  p.setFont("helvetica","bold"); p.setFontSize(SZ.body); p.setTextColor(30,30,30);
  p.text("Total HT", boxX+4, D.y+7); p.text(totalHT.toFixed(2)+" EUR", boxX+boxW-4, D.y+7, {align:"right"});
  D.y += 15;

  const safeRef = (materielState.chantierRef||"chantier").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\-]+/gi,"_").replace(/^_+|_+$/g,"");
  const filename = "Commande_plomberie_"+safeRef+".pdf";
  const blob = pdf.output("blob");
  if(materielState.devisPdfUrl) URL.revokeObjectURL(materielState.devisPdfUrl);
  materielState.devisPdfUrl = URL.createObjectURL(blob);
  materielState.devisPdfFilename = filename;
}

  h += '<button class="btn" onclick="generatePdf()">⚙ Générer le PDF</button>';

    h += '<div style="margin-top:14px;"><a class="btn" style="display:inline-block;text-decoration:none;" href="'+lastPdfUrl+'" download="'+esc(lastPdfFilename)+'" target="_blank" rel="noopener">⬇ Ouvrir / télécharger le PDF</a></div>';
    h += '<p class="small-note">Sur mobile, si un simple appui n\'ouvre rien, essayez un appui long sur le bouton puis « Télécharger le lien » / « Ouvrir dans un nouvel onglet ».</p>';
  }
  h += '<div class="row-actions" style="margin-top:20px;"><button class="btn secondary" onclick="goPrev()">← Retour modifier</button><button class="btn secondary" onclick="newDossier()">Nouveau dossier</button></div>';
  h += '</div>';
  return h;
}

function renderSettings(){
  const tabs = [["metiers","Corps de métier"],["risques","Risques"],["epi","EPI"],["textes","Textes fixes"],["code","Code d'accès"]];
  let h = '<div class="card"><h2>Réglages</h2><p class="hint">Ces modifications s\'appliquent immédiatement pour votre session en cours, mais ne sont pas partagées avec vos collègues ni conservées après fermeture de l\'onglet. Pour un changement permanent pour toute l\'équipe, transmettez-le pour mise à jour du fichier.</p>';
  h += '<div class="settings-tabs">'+tabs.map(t=>'<button class="tab-btn '+(settingsTab===t[0]?"active":"")+'" onclick="setSettingsTab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>';

  if(settingsTab==="metiers"){
    h += '<table class="cfg"><tr><th>Nom</th><th>Nature</th><th>Produits</th><th>Outillage</th><th>Étapes (1/ligne)</th><th>EPI (noms, virgules)</th><th>Risques (noms, virgules)</th><th></th></tr>';
    CONFIG.corpsDeMetier.forEach(m=>{
      h += '<tr>'+
        td('<input type="text" value="'+esc(m.nom)+'" oninput="updateMetierField(\''+m.id+'\',\'nom\',this.value)">')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'nature\',this.value)">'+esc(m.nature)+'</textarea>')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'produits\',this.value)">'+esc(m.produits)+'</textarea>')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'outillage\',this.value)">'+esc(m.outillage)+'</textarea>')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'etapes\',this.value)">'+esc((m.etapes||[]).join("\n"))+'</textarea>')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'epi\',this.value)">'+esc(idsToNames(m.epi,CONFIG.epi))+'</textarea>')+
        td('<textarea rows="2" oninput="updateMetierField(\''+m.id+'\',\'risques\',this.value)">'+esc(idsToNames(m.risques,CONFIG.risques))+'</textarea>')+
        td('<button class="btn ghost" onclick="deleteMetierRow(\''+m.id+'\')">✕</button>')+
      '</tr>';
    });
    h += '</table><button class="btn secondary" onclick="addMetierRow()">＋ Ajouter un métier</button>';
  }
  if(settingsTab==="risques"){
    h += '<table class="cfg"><tr><th>Nom</th><th>Se déclenche si</th><th>EPI ajoutés</th><th>Équipements</th><th>Consignes</th><th>Thème 1/4h</th><th></th></tr>';
    CONFIG.risques.forEach(r=>{
      h += '<tr>'+
        td('<input type="text" value="'+esc(r.nom)+'" oninput="updateRisqueField(\''+r.id+'\',\'nom\',this.value)">')+
        td('<textarea rows="2" oninput="updateRisqueField(\''+r.id+'\',\'declencheSi\',this.value)">'+esc(r.declencheSi)+'</textarea>')+
        td('<textarea rows="2" oninput="updateRisqueField(\''+r.id+'\',\'epi\',this.value)">'+esc(idsToNames(r.epi,CONFIG.epi))+'</textarea>')+
        td('<input type="text" value="'+esc(r.equipements)+'" oninput="updateRisqueField(\''+r.id+'\',\'equipements\',this.value)">')+
        td('<textarea rows="2" oninput="updateRisqueField(\''+r.id+'\',\'consignes\',this.value)">'+esc(r.consignes)+'</textarea>')+
        td('<textarea rows="2" oninput="updateRisqueField(\''+r.id+'\',\'themeQuartHeure\',this.value)">'+esc(r.themeQuartHeure||"")+'</textarea>')+
        td('<button class="btn ghost" onclick="deleteRisqueRow(\''+r.id+'\')">✕</button>')+
      '</tr>';
    });
    h += '</table><button class="btn secondary" onclick="addRisqueRow()">＋ Ajouter un risque</button>';
  }
  if(settingsTab==="epi"){
    h += '<table class="cfg"><tr><th>Nom</th><th>Statut</th><th></th></tr>';
    CONFIG.epi.forEach(e=>{
      h += '<tr>'+
        td('<input type="text" value="'+esc(e.nom)+'" oninput="updateEpiField(\''+e.id+'\',\'nom\',this.value)">')+
        td('<select onchange="updateEpiField(\''+e.id+'\',\'statut\',this.value)">'+
            '<option value="systematique" '+(e.statut==="systematique"?"selected":"")+'>Systématique</option>'+
            '<option value="conditionnel" '+(e.statut==="conditionnel"?"selected":"")+'>Conditionnel</option>'+
          '</select>')+
        td('<button class="btn ghost" onclick="deleteEpiRow(\''+e.id+'\')">✕</button>')+
      '</tr>';
    });
    h += '</table><button class="btn secondary" onclick="addEpiRow()">＋ Ajouter un EPI</button>';
  }
  if(settingsTab==="textes"){
    h += '<div class="field"><label>Contraintes de site (utiliser [variable] pour le code d\'accès chantier)</label><textarea rows="6" oninput="updateTexteFixe(\'contraintesSite\',this.value)">'+esc(CONFIG.textes.contraintesSite)+'</textarea></div>';
    h += '<div class="field"><label>Précautions particulières (fixe, une par ligne)</label><textarea rows="4" oninput="updateTexteFixe(\'precautions\',this.value)">'+esc(CONFIG.textes.precautions)+'</textarea></div>';
    h += '<div class="field"><label>Texte d\'attestation</label><textarea rows="3" oninput="updateTexteFixe(\'attestation\',this.value)">'+esc(CONFIG.textes.attestation)+'</textarea></div>';
    h += '<div class="field"><label>Socle fixe du 1/4h sécurité (un thème par ligne)</label><textarea rows="6" oninput="updateSocle(this.value)">'+esc(CONFIG.socleQuartHeure.join("\n"))+'</textarea></div>';
  }
  if(settingsTab==="code"){
    h += '<div class="field" style="max-width:220px;"><label>Code d\'accès à l\'application</label><input type="text" value="'+esc(CONFIG.accessCode)+'" oninput="updateAccessCode(this.value)"></div>';
  }

  h += '<div class="row-actions"><button class="btn secondary" onclick="toggleSettings()">Fermer sans enregistrer</button><button class="btn" onclick="saveSettings()">Enregistrer les réglages</button></div>';
  h += '</div>';
  return h;
}
function td(inner){ return '<td>'+inner+'</td>'; }

function render(){
  const app = document.getElementById("app");
  if(!CONFIG){ app.innerHTML = "Chargement…"; return; }
  let html = renderTopbar();
  if(!unlocked){
    html += renderGate();
  } else if(settingsOpen){
    html += '<main>'+renderSettings()+'</main>';
  } else {
    html += '<main>'+renderStepper();
    if(currentStep==="select") html += renderStepSelect();
    if(currentStep==="chantier") html += renderStep1();
    if(currentStep==="sous-traitants") html += renderStep2();
    if(currentStep==="apercu") html += renderStep3();
    if(currentStep==="pdf") html += renderStep4();
    if(currentStep==="materiel") html += renderStepMateriel();
    html += '</main>';
    html += '<div class="footer-note">Paris Ouest Construction — outil interne créé par Jean Bourdel pour l\'équipe CASVP. Ne pas diffuser en dehors de l\'équipe. <span style="opacity:.7">Version du 07/10 · mobile v5 · 1/4h v1</span></div>';
  }
  app.innerHTML = html;
}

function setupPWATags(){
  try{
    const iconDataUrl = "data:image/png;base64,"+SITE_ICON_B64;
    const manifest = {
      name: "Paris Ouest — Démarrage de chantier",
      short_name: "Chantier PO",
      start_url: ".",
      display: "standalone",
      background_color: "#FAF9F7",
      theme_color: "#EA4F00",
      icons: [{ src: iconDataUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }]
    };
    const manifestUrl = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
    const addLink = (rel, href)=>{ const l=document.createElement("link"); l.rel=rel; l.href=href; document.head.appendChild(l); };
    const addMeta = (name, content)=>{ const m=document.createElement("meta"); m.name=name; m.content=content; document.head.appendChild(m); };
    addLink("manifest", manifestUrl);
    addLink("apple-touch-icon", iconDataUrl);
    addLink("icon", iconDataUrl);
    addMeta("theme-color", "#EA4F00");
    addMeta("mobile-web-app-capable", "yes");
    addMeta("apple-mobile-web-app-capable", "yes");
    addMeta("apple-mobile-web-app-title", "Chantier PO");
    addMeta("apple-mobile-web-app-status-bar-style", "black-translucent");
  }catch(e){ console.error("PWA tags error", e); }
}

/* =========================================================================
   INITIALISATION
   ========================================================================= */
window.onerror = function(msg, src, line){
  const app = document.getElementById("app");
  if(app) app.innerHTML = '<div class="err-banner" style="margin:20px;">Erreur : '+esc(msg)+' (ligne '+line+')</div>'+app.innerHTML;
};

function init(){
  setupPWATags();
  render();
}
init();
